# Sinh tu ctf_dqn.yaml boi train_all.py — max_steps=20,000. Dung sua tay.
behaviors:
  PuzzleBehavior:
    trainer_type: dqn
    hyperparameters:
      batch_size: 512
      buffer_size: 200000
      buffer_init_steps: 2000
      learning_rate: 0.0003
      learning_rate_schedule: constant
      tau: 0.005
      steps_per_update: 20
      save_replay_buffer: false
      exploration_schedule: linear
      exploration_initial_eps: 1.0
      exploration_final_eps: 0.01
      exploration_decay_steps: 1000000
      reward_signal_steps_per_update: 20
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.02
        learning_rate: 0.0003
    keep_checkpoints: 10
    max_steps: 20000
    time_horizon: 128
    summary_freq: 5000
environment_parameters:
  handoff_required:
    curriculum:
    - name: Lesson0_DoorOpen
      completion_criteria:
        measure: reward
        behavior: PuzzleBehavior
        signal_smoothing: true
        min_lesson_length: 100
        threshold: 0.6
      value: 0.0
    - name: Lesson1_Handoff
      value: 1.0
