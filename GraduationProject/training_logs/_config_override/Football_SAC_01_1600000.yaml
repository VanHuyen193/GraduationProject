# Sinh tu football_sac.yaml boi train_all.py — max_steps=1,600,000. Dung sua tay.
behaviors:
  Football:
    trainer_type: sac
    hyperparameters:
      batch_size: 1024
      buffer_size: 500000
      learning_rate: 0.0003
      learning_rate_schedule: constant
      buffer_init_steps: 5000
      tau: 0.005
      steps_per_update: 20
      save_replay_buffer: false
      init_entcoef: 1.0
      reward_signal_steps_per_update: 20
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    self_play:
      save_steps: 50000
      team_change: 100000
      swap_steps: 200000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0
    keep_checkpoints: 10
    max_steps: 1600000
    time_horizon: 1000
    summary_freq: 10000
