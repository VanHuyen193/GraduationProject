# Sinh tu football_dqn.yaml boi train_all.py — max_steps=20,000. Dung sua tay.
behaviors:
  Football:
    trainer_type: dqn
    hyperparameters:
      batch_size: 1024
      buffer_size: 500000
      buffer_init_steps: 5000
      learning_rate: 0.0003
      learning_rate_schedule: constant
      tau: 0.005
      steps_per_update: 20
      save_replay_buffer: false
      exploration_schedule: linear
      exploration_initial_eps: 1.0
      exploration_final_eps: 0.01
      exploration_decay_steps: 400000
      reward_signal_steps_per_update: 20
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    self_play:
      save_steps: 50000
      team_change: 100000
      swap_steps: 200000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0
    keep_checkpoints: 10
    max_steps: 20000
    time_horizon: 1000
    summary_freq: 5000
