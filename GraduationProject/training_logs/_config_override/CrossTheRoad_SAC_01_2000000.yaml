# Sinh tu ctr_sac.yaml boi train_all.py — max_steps=2,000,000. Dung sua tay.
behaviors:
  CrossTheRoad:
    trainer_type: sac
    hyperparameters:
      batch_size: 256
      buffer_size: 100000
      learning_rate: 0.0003
      learning_rate_schedule: constant
      buffer_init_steps: 1000
      tau: 0.005
      steps_per_update: 20
      save_replay_buffer: false
      init_entcoef: 0.5
      reward_signal_steps_per_update: 20
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.02
        learning_rate: 0.0003
    keep_checkpoints: 5
    max_steps: 2000000
    time_horizon: 64
    summary_freq: 10000
