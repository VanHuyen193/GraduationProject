# Sinh tu ctr_dqn.yaml boi train_all.py — max_steps=2,000,000. Dung sua tay.
behaviors:
  CrossTheRoad:
    trainer_type: dqn
    hyperparameters:
      batch_size: 256
      buffer_size: 100000
      buffer_init_steps: 1000
      learning_rate: 0.0003
      learning_rate_schedule: constant
      tau: 0.005
      steps_per_update: 20
      save_replay_buffer: false
      exploration_schedule: linear
      exploration_initial_eps: 1.0
      exploration_final_eps: 0.05
      exploration_decay_steps: 500000
      reward_signal_steps_per_update: 20
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.02
        learning_rate: 0.0003
    keep_checkpoints: 5
    max_steps: 2000000
    time_horizon: 64
    summary_freq: 10000
