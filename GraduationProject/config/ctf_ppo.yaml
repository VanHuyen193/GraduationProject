# Algorithm: PPO (Proximal Policy Optimization)
# Environment: Capture The Flag / Collaboration
# Action space: Discrete (7: idle, fwd, back, rotate-R, rotate-L, strafe-L, strafe-R)
# Notes: PPO with individual agent rewards. Each agent learns independently.
#        Group rewards from SimpleMultiAgentGroup distributed as individual rewards.

behaviors:
  PuzzleBehavior:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.02
        learning_rate: 3.0e-4
    keep_checkpoints: 10
    max_steps: 5000000
    time_horizon: 128
    summary_freq: 20000
