# Algorithm: DQN (Deep Q-Network) - custom trainer plugin (khong co san trong ML-Agents)
# Environment: Football Table
# Action space: Discrete 8 branches x 3 ({-1, 0, +1} cho [truot, xoay] x 4 thanh)
#   -> YEU CAU doi Behavior Parameters trong Football.unity truoc khi train:
#      Continuous Actions = 0, Discrete Branches = 8, moi branch size = 3
#      (FootballAgent tu chuyen doi discrete -> continuous trong OnActionReceived)
# Notes: Multi-branch (branching) DQN, Double DQN, self-play nhu ban SAC.
#        Epsilon-greedy 1.0 -> 0.05 trong 2M steps.

behaviors:
  Football:
    trainer_type: dqn
    hyperparameters:
      batch_size: 1024
      buffer_size: 500000
      buffer_init_steps: 5000
      learning_rate: 3.0e-4
      learning_rate_schedule: constant
      tau: 0.005
      # DQN la off-policy giong SAC: de 1 thi cap nhat gradient sau TUNG buoc
      # moi truong, do duoc ~19 buoc/s. Dat 20 cho khop cac config sac_*.
      steps_per_update: 20
      save_replay_buffer: false
      exploration_schedule: linear
      exploration_initial_eps: 1.0
      exploration_final_eps: 0.01
      # 400K, KHONG phai 2M.
      #
      # Doc tfevents cua football_dqn_v1: Policy/epsilon o buoc cuoi (1,60M) van
      # con 0,621 — tuc gan hai phan ba hanh dong o cuoi qua trinh huan luyen la
      # NGAU NHIEN. Lich giam dem theo policy.get_current_step(), ma Football co
      # hai tac nhan nen bo dem chinh sach chi chay duoc ~800K khi moi truong bao
      # 1,6M; dat decay 2M trong khi ngan sach that chi 1,6M thi epsilon khong bao
      # gio ket thuc lich giam. Con so 1,825 cua lan chay do vi vay khong phan anh
      # chinh sach da hoc.
      # 400K policy step => epsilon cham day o khoang 800K buoc moi truong, con
      # lai nua sau cua lan chay o muc 0,01.
      exploration_decay_steps: 400000
      reward_signal_steps_per_update: 20
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    # BAT self-play — giong het khoi self_play cua football_ppo/sac/poca/mappo,
    # de nam thuat toan tren Football chay cung mot dieu kien va deu co ELO.
    #
    # Truoc day khoi nay bi chu thich lai vi mlagents-learn chet ngay luc khoi tao:
    #   KeyError: BehaviorIdentifiers(behavior_id='Football?team=1', ...)
    # tai ghost/trainer.py:369. Nguyen nhan la DQNTrainer thieu ham get_policy()
    # (PPO/SAC/POCA deu co), nen roi xuong Trainer.get_policy mac dinh — ham do tra
    # ve self.policies[name_behavior_id] trong khi ghost truyen vao OBJECT chu khong
    # phai chuoi. Da them get_policy() vao
    # ml-agents-trainer-plugin/mlagents_trainer_plugin/dqn/dqn_trainer.py, khong con
    # loi nay nua. Neu chay lai ma van gap KeyError do thi kiem tra plugin da duoc
    # cai editable (pip install --no-build-isolation -e) va dang tro dung thu muc.
    self_play:
      save_steps: 50000
      team_change: 100000
      swap_steps: 200000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0
    keep_checkpoints: 10
    max_steps: 10000000
    time_horizon: 1000
    summary_freq: 10000
