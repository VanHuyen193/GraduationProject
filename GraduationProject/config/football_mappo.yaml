# Algorithm: MAPPO (Multi-Agent PPO, trainer plugin)
# Environment: Football Table
# Action space: Continuous (8 = 2 per rod x 4 rods)
# Notes: Sao y football_poca.yaml, doi moi trainer_type. Giu nguyen sieu tham so
#        de phep so sanh MAPPO vs MA-POCA chi khac dung mot thu: MAPPO bo
#        counterfactual baseline, con lai dung chung MultiAgentNetworkBody.
#
#        Football khong dung SimpleMultiAgentGroup nen nhom chi co mot thanh
#        vien, critic tap trung suy bien ve critic thuong — MAPPO o day gan nhu
#        PPO. Van chay duoc va van co y nghia lam moc doi chieu, nhung dung
#        trong doi no khac biet nhieu so voi PPO tren moi truong nay.
#
#        Plugin MAPPO khong ho tro memory/LSTM (se bao loi ro neu them
#        network_settings.memory).

behaviors:
  Football:
    trainer_type: mappo
    hyperparameters:
      batch_size: 2048
      buffer_size: 40960
      learning_rate: 3.0e-4
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    self_play:
      save_steps: 50000
      team_change: 100000
      swap_steps: 200000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0
    keep_checkpoints: 10
    max_steps: 10000000
    time_horizon: 1000
    summary_freq: 10000
