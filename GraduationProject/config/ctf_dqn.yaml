# Algorithm: DQN (Deep Q-Network) - custom trainer plugin (khong co san trong ML-Agents)
# Environment: Capture The Flag / Collaboration
# Action space: Discrete (7: idle, fwd, back, rotate-R, rotate-L, strafe-L, strafe-R)
# Notes: DQN hoc theo reward ca nhan (AddReward); group reward cua
#        SimpleMultiAgentGroup khong duoc dung boi off-policy trainer
#        (giong han che cua SAC tren moi truong nay).
#        Epsilon-greedy 1.0 -> 0.05 trong 1M steps.

behaviors:
  PuzzleBehavior:
    trainer_type: dqn
    hyperparameters:
      batch_size: 512
      buffer_size: 200000
      buffer_init_steps: 2000
      learning_rate: 3.0e-4
      learning_rate_schedule: constant
      tau: 0.005
      # DQN la off-policy giong SAC: de 1 thi cap nhat gradient sau TUNG buoc
      # moi truong, do duoc ~19 buoc/s. Dat 20 cho khop cac config sac_*.
      steps_per_update: 20
      save_replay_buffer: false
      exploration_schedule: linear
      exploration_initial_eps: 1.0
      # 0,01 cho khop ctr_dqn.yaml / football_dqn.yaml — xem ly do day du trong
      # ctr_dqn.yaml. Ba lan chay DQN phai dung cung muc epsilon san thi moi so
      # sanh cheo giua ba moi truong duoc.
      exploration_final_eps: 0.01
      exploration_decay_steps: 1000000
      reward_signal_steps_per_update: 20
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.02
        learning_rate: 3.0e-4
    keep_checkpoints: 10
    max_steps: 5000000
    time_horizon: 128
    summary_freq: 20000

# Curriculum GIONG HET ctf_ppo / ctf_poca / ctf_mappo — xem ghi chu day du trong
# ctf_sac.yaml. File nay truoc day cung thieu khoi environment_parameters, nen
# ctf_dqn_v1 hoc thang bai kho (cua khoa mac dinh 1.0) tu buoc 0 giong ctf_sac_v1.
# Ket qua 0,800 cua no khong sai, nhung dat duoc trong dieu kien KHAC ba thuat toan
# kia — mot bang so sanh nam thuat toan thi khong duoc phep lech nhu vay.
environment_parameters:
  handoff_required:
    curriculum:
      - name: Lesson0_DoorOpen
        completion_criteria:
          measure: reward
          behavior: PuzzleBehavior
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.6
        value: 0.0
      - name: Lesson1_Handoff
        value: 1.0
