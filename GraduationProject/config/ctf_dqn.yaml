# Algorithm: DQN (Deep Q-Network) - custom trainer plugin (khong co san trong ML-Agents)
# Environment: Capture The Flag / Collaboration
# Action space: Discrete (7: idle, fwd, back, rotate-R, rotate-L, strafe-L, strafe-R)
# Notes: DQN hoc theo reward ca nhan (AddReward); group reward cua
#        SimpleMultiAgentGroup khong duoc dung boi off-policy trainer
#        (giong han che cua SAC tren moi truong nay).
#        Epsilon-greedy 1.0 -> 0.05 trong 1M steps.

behaviors:
  PuzzleBehavior:
    trainer_type: dqn
    hyperparameters:
      batch_size: 512
      buffer_size: 200000
      buffer_init_steps: 2000
      learning_rate: 3.0e-4
      learning_rate_schedule: constant
      tau: 0.005
      steps_per_update: 1
      save_replay_buffer: false
      exploration_schedule: linear
      exploration_initial_eps: 1.0
      exploration_final_eps: 0.05
      exploration_decay_steps: 1000000
      reward_signal_steps_per_update: 1
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.02
        learning_rate: 3.0e-4
    keep_checkpoints: 10
    max_steps: 5000000
    time_horizon: 128
    summary_freq: 20000
