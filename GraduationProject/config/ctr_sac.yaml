# Algorithm: SAC (Soft Actor-Critic)
# Environment: Cross The Road
# Action space: Discrete (4: idle, left, right, forward)
# Notes: SAC with replay buffer for better sample efficiency.
#        Entropy regularization helps exploration in sparse-reward navigation.

behaviors:
  CrossTheRoad:
    trainer_type: sac
    hyperparameters:
      batch_size: 256
      buffer_size: 100000
      learning_rate: 3.0e-4
      learning_rate_schedule: constant
      buffer_init_steps: 1000
      tau: 0.005
      steps_per_update: 1
      save_replay_buffer: false
      init_entcoef: 0.5
      reward_signal_steps_per_update: 1
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.02
        learning_rate: 3.0e-4
    keep_checkpoints: 5
    max_steps: 2000000
    time_horizon: 64
    summary_freq: 10000
