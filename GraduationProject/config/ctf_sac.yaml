# Algorithm: SAC (Soft Actor-Critic)
# Environment: Capture The Flag / Collaboration
# Action space: Discrete (7: idle, fwd, back, rotate-R, rotate-L, strafe-L, strafe-R)
# Notes: SAC off-policy for cooperative multi-agent. Each agent has its own
#        replay buffer. Entropy term encourages diverse exploration.

behaviors:
  PuzzleBehavior:
    trainer_type: sac
    hyperparameters:
      batch_size: 512
      buffer_size: 200000
      learning_rate: 3.0e-4
      learning_rate_schedule: constant
      buffer_init_steps: 2000
      tau: 0.005
      steps_per_update: 1
      save_replay_buffer: false
      init_entcoef: 0.5
      reward_signal_steps_per_update: 1
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.02
        learning_rate: 3.0e-4
    keep_checkpoints: 10
    max_steps: 5000000
    time_horizon: 128
    summary_freq: 20000
