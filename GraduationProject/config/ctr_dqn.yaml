# Algorithm: DQN (Deep Q-Network) - custom trainer plugin (khong co san trong ML-Agents)
# Environment: Cross The Road
# Action space: Discrete (4: idle, left, right, forward)
# Notes: Off-policy, replay buffer, epsilon-greedy exploration (1.0 -> 0.05
#        trong 500k steps). Double DQN + soft target update (tau).
#        Curiosity giu nguyen nhu ban PPO/SAC de so sanh cong bang.

behaviors:
  CrossTheRoad:
    trainer_type: dqn
    hyperparameters:
      batch_size: 256
      buffer_size: 100000
      buffer_init_steps: 1000
      learning_rate: 3.0e-4
      learning_rate_schedule: constant
      tau: 0.005
      # DQN la off-policy giong SAC: de 1 thi cap nhat gradient sau TUNG buoc
      # moi truong, do duoc ~19 buoc/s. Dat 20 cho khop cac config sac_*.
      steps_per_update: 20
      save_replay_buffer: false
      exploration_schedule: linear
      exploration_initial_eps: 1.0
      exploration_final_eps: 0.05
      exploration_decay_steps: 500000
      reward_signal_steps_per_update: 20
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.02
        learning_rate: 3.0e-4
    keep_checkpoints: 5
    max_steps: 2000000
    time_horizon: 64
    summary_freq: 10000
