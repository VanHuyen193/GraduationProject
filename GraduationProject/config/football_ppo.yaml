# Algorithm: PPO (Proximal Policy Optimization)
# Environment: Football Table
# Action space: Continuous (8 = 2 per rod x 4 rods)
# Notes: PPO with Self-Play for competitive 2-agent game.
#        normalize=true critical for continuous physics observations.

behaviors:
  Football:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 40960
      learning_rate: 3.0e-4
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 5
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    self_play:
      save_steps: 50000
      team_change: 200000
      swap_steps: 2000000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0
    keep_checkpoints: 10
    max_steps: 10000000
    time_horizon: 1000
    summary_freq: 50000
