# Algorithm: MA-POCA (Multi-Agent POsthumous Credit Assignment)
# Environment: Capture The Flag / Collaboration
# Action space: Discrete (7: idle, fwd, back, rotate-R, rotate-L, strafe-L, strafe-R)
# Notes: POCA is the ideal algorithm here. SimpleMultiAgentGroup with group
#        rewards is exactly what POCA is designed for.
#        Centralized critic sees all agents' observations during training,
#        enabling better credit assignment for cooperative tasks.

behaviors:
  PuzzleBehavior:
    trainer_type: poca
    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
      # KHONG dung memory/LSTM de giu giong ctf_mappo.yaml (plugin MAPPO chua ho tro
      # recurrent). Observation da bo sung trang thai handoff cua dong doi nen bai
      # toan gan-Markov, khong can bo nho hoi tiep.
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.02
        learning_rate: 3.0e-4
    keep_checkpoints: 10
    max_steps: 5000000
    time_horizon: 128
    summary_freq: 20000

# (b) Curriculum: giong ctf_mappo.yaml — bai hoc 0 mo san cua, bai hoc 1 khoa cua
#     (bat buoc handoff). EnvController.cs doc handoff_required qua EnvironmentParameters.
environment_parameters:
  handoff_required:
    curriculum:
      - name: Lesson0_DoorOpen
        completion_criteria:
          measure: reward
          behavior: PuzzleBehavior
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.6
        value: 0.0
      - name: Lesson1_Handoff
        value: 1.0
