# Algorithm: DQN (Deep Q-Network) - custom trainer plugin (khong co san trong ML-Agents)
# Environment: Football Table
# Action space: Discrete 8 branches x 3 ({-1, 0, +1} cho [truot, xoay] x 4 thanh)
#   -> YEU CAU doi Behavior Parameters trong Football.unity truoc khi train:
#      Continuous Actions = 0, Discrete Branches = 8, moi branch size = 3
#      (FootballAgent tu chuyen doi discrete -> continuous trong OnActionReceived)
# Notes: Multi-branch (branching) DQN, Double DQN, self-play nhu ban SAC.
#        Epsilon-greedy 1.0 -> 0.05 trong 2M steps.

behaviors:
  Football:
    trainer_type: dqn
    hyperparameters:
      batch_size: 1024
      buffer_size: 500000
      buffer_init_steps: 5000
      learning_rate: 3.0e-4
      learning_rate_schedule: constant
      tau: 0.005
      # DQN la off-policy giong SAC: de 1 thi cap nhat gradient sau TUNG buoc
      # moi truong, do duoc ~19 buoc/s. Dat 20 cho khop cac config sac_*.
      steps_per_update: 20
      save_replay_buffer: false
      exploration_schedule: linear
      exploration_initial_eps: 1.0
      exploration_final_eps: 0.05
      exploration_decay_steps: 2000000
      reward_signal_steps_per_update: 20
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    # TAT self-play cho DQN.
    #
    # Bat len thi mlagents-learn chet ngay luc khoi tao voi
    #   KeyError: BehaviorIdentifiers(behavior_id='Football?team=1', ...)
    # tai ghost/trainer.py:369. Cho do goi self.trainer.get_policy(parsed_behavior_id)
    # truyen vao OBJECT BehaviorIdentifiers, trong khi dict self.policies chi bao gio
    # duoc gan bang KHOA CHUOI (off_policy_trainer.py:165, on_policy_trainer.py:133).
    # Day la code goc cua ML-Agents, khong phai plugin DQN.
    #
    # LUU Y CHO BAO CAO: bon thuat toan con lai tren Football (PPO/SAC/MA-POCA/MAPPO)
    # deu chay CO self-play, rieng DQN thi khong — hai ben khong hoan toan cung dieu
    # kien. ML-Agents con canh bao ro: "Your environment contains multiple teams, but
    # DQNTrainer doesn't support adversarial games." Phai neu diem nay khi so sanh.
    # self_play:
    #   save_steps: 50000
    #   team_change: 100000
    #   swap_steps: 200000
    #   window: 10
    #   play_against_latest_model_ratio: 0.5
    #   initial_elo: 1200.0
    keep_checkpoints: 10
    max_steps: 10000000
    time_horizon: 1000
    summary_freq: 10000
