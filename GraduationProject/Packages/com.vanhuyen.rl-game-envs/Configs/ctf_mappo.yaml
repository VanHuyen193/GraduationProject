# Algorithm: MAPPO (Multi-Agent PPO, Yu et al. 2022) - custom trainer plugin
# Environment: Capture The Flag / Collaboration
# Action space: Discrete (7: idle, fwd, back, rotate-R, rotate-L, strafe-L, strafe-R)
# Notes: PPO voi centralized critic nhin observation cua CA NHOM
#        (dung MultiAgentNetworkBody nhu POCA) nhung KHONG dung
#        counterfactual baseline: advantage = GAE so voi centralized value.
#        Diem so sanh chinh voi MA-POCA trong do an: cung critic tap trung,
#        khac cach tinh credit assignment.
#        Hyperparameter giu giong ctf_poca.yaml de so sanh cong bang.
#        (MAPPO chi co y nghia voi moi truong multi-agent co group —
#         tren CrossTheRoad/Football no suy bien thanh PPO thuong.)

behaviors:
  PuzzleBehavior:
    trainer_type: mappo
    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
      # KHONG dung memory/LSTM: plugin MAPPO chua ho tro recurrent (raise loi).
      # Thay vao do, observation da them 2 bool ThisAgentLeft (minh + dong doi)
      # trong PuzzleAgent.cs -> trang thai handoff quan sat truc tiep tung frame
      # nen bai toan gan-Markov, khong can bo nho hoi tiep. Giu memoryless de
      # so sanh cong bang voi ctf_poca.yaml.
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.02
        learning_rate: 3.0e-4
    keep_checkpoints: 10
    max_steps: 5000000
    time_horizon: 128
    summary_freq: 20000

# (b) Curriculum: bai hoc 0 mo san cua (handoff_required=0) de agent hoc di chuyen
#     toi checkpoint truoc; khi mean group reward vuot nguong thi chuyen sang bai 1
#     (handoff_required=1) — khoa cua, bat buoc hoc bàn giao giữ cửa.
#     EnvController.cs doc tham so nay qua Academy.EnvironmentParameters.
environment_parameters:
  handoff_required:
    curriculum:
      - name: Lesson0_DoorOpen
        completion_criteria:
          measure: reward
          behavior: PuzzleBehavior
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.6
        value: 0.0
      - name: Lesson1_Handoff
        value: 1.0
