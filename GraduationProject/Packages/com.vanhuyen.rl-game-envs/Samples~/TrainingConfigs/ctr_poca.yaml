# Algorithm: MA-POCA (Multi-Agent POsthumous Credit Assignment)
# Environment: Cross The Road
# Action space: Discrete (4: idle, left, right, forward)
# Notes: POCA applied to single-agent navigation for comparison.
#        With single agent, POCA behaves similar to PPO with centralized critic.

behaviors:
  CrossTheRoad:
    trainer_type: poca
    hyperparameters:
      batch_size: 512
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.99
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.02
        learning_rate: 3.0e-4
    keep_checkpoints: 5
    max_steps: 2000000
    time_horizon: 64
    summary_freq: 10000
