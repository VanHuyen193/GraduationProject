# Algorithm: PPO (Proximal Policy Optimization)
# Environment: Capture The Flag / Collaboration
# Action space: Discrete (7: idle, fwd, back, rotate-R, rotate-L, strafe-L, strafe-R)
# Notes: PPO with individual agent rewards. Each agent learns independently.
#        LUU Y: PPO KHONG dung group reward (chi trainer da-agent nhu POCA/MAPPO moi dung
#        AddGroupReward). Cac group reward se bi BO QUA -> PPO chi hoc tu reward ca nhan
#        (distance shaping + plate presence). Day chinh la ly do ky vong PPO kho hoc handoff.

behaviors:
  PuzzleBehavior:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.02
        learning_rate: 3.0e-4
    keep_checkpoints: 10
    max_steps: 5000000
    time_horizon: 128
    summary_freq: 20000

# Curriculum GIONG ctf_poca.yaml / ctf_mappo.yaml de so sanh cong bang:
# bai 0 mo san cua (handoff_required=0), bai 1 khoa cua (=1). EnvController.cs doc qua
# Academy.EnvironmentParameters. PPO van chay curriculum binh thuong (do la co che moi truong).
environment_parameters:
  handoff_required:
    curriculum:
      - name: Lesson0_DoorOpen
        completion_criteria:
          measure: reward
          behavior: PuzzleBehavior
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.6
        value: 0.0
      - name: Lesson1_Handoff
        value: 1.0
