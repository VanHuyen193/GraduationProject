# Algorithm: SAC (Soft Actor-Critic)
# Environment: Football Table
# Action space: Continuous (8 = 2 per rod x 4 rods)
# Notes: SAC for continuous control with Self-Play for competitive
#        2-agent game.
#        Off-policy with replay buffer gives better sample efficiency.

behaviors:
  Football:
    trainer_type: sac
    hyperparameters:
      batch_size: 1024
      buffer_size: 500000
      learning_rate: 3.0e-4
      learning_rate_schedule: constant
      buffer_init_steps: 5000
      tau: 0.005
      steps_per_update: 20
      save_replay_buffer: false
      init_entcoef: 1.0
      reward_signal_steps_per_update: 20
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    self_play:
      save_steps: 50000
      team_change: 100000
      swap_steps: 200000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0
    keep_checkpoints: 10
    max_steps: 10000000
    time_horizon: 1000
    summary_freq: 10000
